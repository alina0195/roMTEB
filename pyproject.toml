[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romteb"
version = "0.1.0"
description = "RoMTEB: Romanian Massive Text Embedding Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alina Gheorghe" }]
dependencies = [
    "mteb>=2.0,<3.0",
    "sentence-transformers>=3.0",
    "datasets>=2.14",
    "huggingface_hub>=0.24",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "tabulate>=0.9",
    "pytrec_eval-terrier",
    "bm25s",
    "PyStemmer",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
romteb-eval = "romteb.cli:main"
romteb-aggregate = "romteb.cli:aggregate_main"

[tool.setuptools.packages.find]
include = ["romteb*"]
exclude = ["data_prep_outputs*", "results*"]

[tool.setuptools.package-data]
romteb = ["tasks/_revisions.json"]
